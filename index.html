<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gun and Run</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background: #0f0f14;
      }
      #app {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        place-content: center;
      }
      #app canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
