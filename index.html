<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gun and Run</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background: #0f0f14;
      }
      #app {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      /* Let Phaser's Scale Manager own canvas width/height — extra max-* rules here
         desync pointer coordinates from the drawn image (hitboxes feel shifted).
         Force margin: 0 so a stale Phaser inline `margin-left/top` (from a prior
         `autoCenter: CENTER_BOTH` config) can't fight the flex centering on `#app`
         and push the canvas off-center. */
      #app canvas {
        display: block;
        margin: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
